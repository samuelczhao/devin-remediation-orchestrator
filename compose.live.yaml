services:
  orchestrator:
    environment:
      REMEDIATION_APP_MODE: live
      REMEDIATION_DATABASE_PATH: /data/live-orchestrator.db
      REMEDIATION_DEVIN_API_KEY: "${REMEDIATION_DEVIN_API_KEY:?REMEDIATION_DEVIN_API_KEY is required}"
      REMEDIATION_DEVIN_ORG_ID: "${REMEDIATION_DEVIN_ORG_ID:?REMEDIATION_DEVIN_ORG_ID is required}"
      REMEDIATION_DEVIN_MAX_ACU_LIMIT: "${REMEDIATION_DEVIN_MAX_ACU_LIMIT:-3}"
      REMEDIATION_DEVIN_BYPASS_APPROVAL: "${REMEDIATION_DEVIN_BYPASS_APPROVAL:-false}"
      REMEDIATION_USAGE_MODEL: "${REMEDIATION_USAGE_MODEL:-self_serve}"
      REMEDIATION_GITHUB_WEBHOOK_SECRET: "${REMEDIATION_GITHUB_WEBHOOK_SECRET:?REMEDIATION_GITHUB_WEBHOOK_SECRET is required}"
      REMEDIATION_CONTROL_PLANE_USERNAME: "${REMEDIATION_CONTROL_PLANE_USERNAME:-operator}"
      REMEDIATION_CONTROL_PLANE_PASSWORD: "${REMEDIATION_CONTROL_PLANE_PASSWORD:?REMEDIATION_CONTROL_PLANE_PASSWORD is required}"
      REMEDIATION_POLL_INTERVAL_SECONDS: "${REMEDIATION_POLL_INTERVAL_SECONDS:-15}"
      REMEDIATION_WORKER_STALE_AFTER_SECONDS: "${REMEDIATION_WORKER_STALE_AFTER_SECONDS:-60}"
      REMEDIATION_MAX_ACTIVE_SESSIONS: "${REMEDIATION_MAX_ACTIVE_SESSIONS:-3}"
      REMEDIATION_CREATE_RETRY_INTERVAL_SECONDS: "${REMEDIATION_CREATE_RETRY_INTERVAL_SECONDS:-60}"
