services:
  orchestrator:
    build:
      context: .
    init: true
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REMEDIATION_HOST_PORT:-8000}:8000"
    environment:
      REMEDIATION_APP_MODE: simulation
      REMEDIATION_DATABASE_PATH: /data/orchestrator.db
      REMEDIATION_GITHUB_WEBHOOK_SECRET: local-demo-secret
      REMEDIATION_POLL_INTERVAL_SECONDS: "2"
    volumes:
      - orchestrator-data:/data
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  orchestrator-data:
