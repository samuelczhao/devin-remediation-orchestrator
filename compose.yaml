services:
  orchestrator:
    build:
      context: .
    init: true
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_MODE: "${APP_MODE:-simulation}"
      DATABASE_PATH: /data/orchestrator.db
      DEVIN_API_KEY:
      DEVIN_ORG_ID:
      DEVIN_MAX_ACU_LIMIT: "${DEVIN_MAX_ACU_LIMIT:-3}"
      DEVIN_BYPASS_APPROVAL: "${DEVIN_BYPASS_APPROVAL:-false}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-local-demo-secret}"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-2}"
    volumes:
      - orchestrator-data:/data
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  orchestrator-data:
